# Adapted from Omarchy's Dell XPS 14/16 (2026) tuning (MIT, Copyright (c) David Heinemeier Hansson).
# The response curve was derived from xps-audio-linux's xps-clone profile (MIT, Spencer Bull).
# The profile is measured on SKU 0DB9; SKU 0DBA is included on the source report, not measured.
# Gooarchy uses PipeWire's built-in filters and clamp instead of the upstream LV2 limiter package.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Gooarchy Speaker Tuning"
      media.name = "Gooarchy Speaker Tuning"
      filter.graph = {
        nodes = [
          { type = builtin name = gain_l label = linear control = { "Mult" = 0.5456 "Add" = 0.0 } }
          { type = builtin name = gain_r label = linear control = { "Mult" = 0.5456 "Add" = 0.0 } }
          { type = builtin name = eq label = param_eq config = {
            filters = [
              { type = bq_highpass freq = 60.9 q = 1.0 }
              { type = bq_highpass freq = 60.9 q = 1.0 }
              { type = bq_peaking freq = 83.4 q = 1.8 gain = -8.0 }
              { type = bq_peaking freq = 100.4 q = 1.59 gain = 7.47 }
              { type = bq_peaking freq = 250.5 q = 2.966 gain = -4.7 }
              { type = bq_peaking freq = 419.8 q = 3.0 gain = -5.83 }
              { type = bq_peaking freq = 631.3 q = 2.515 gain = -10.33 }
              { type = bq_peaking freq = 894.4 q = 4.0 gain = -2.42 }
              { type = bq_peaking freq = 1355.7 q = 2.884 gain = 6.92 }
              { type = bq_peaking freq = 1707.2 q = 1.311 gain = -6.54 }
              { type = bq_peaking freq = 3100.0 q = 0.5 gain = -10.09 }
              { type = bq_peaking freq = 3200.0 q = 1.048 gain = 3.09 }
              { type = bq_highshelf freq = 6015.2 q = 1.5 gain = -1.34 }
            ]
          } }
          { type = builtin name = clamp_l label = clamp control = { "Min" = -0.891 "Max" = 0.891 } }
          { type = builtin name = clamp_r label = clamp control = { "Min" = -0.891 "Max" = 0.891 } }
        ]
        links = [
          { output = "gain_l:Out" input = "eq:In 1" }
          { output = "gain_r:Out" input = "eq:In 2" }
          { output = "eq:Out 1" input = "clamp_l:In" }
          { output = "eq:Out 2" input = "clamp_r:In" }
        ]
        inputs = [ "gain_l:In" "gain_r:In" ]
        outputs = [ "clamp_l:Out" "clamp_r:Out" ]
      }
      capture.props = {
        node.name = gooarchy_speaker_tuning
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        filter.smart = true
        filter.smart.name = "gooarchy-speaker-tuning"
        filter.smart.target = { node.name = "~alsa_output.*sof_sdw.*HiFi__Speaker__sink$" }
        stream.dont-remix = true
      }
      playback.props = {
        node.name = gooarchy_speaker_tuning_output
        node.passive = true
        node.dont-fallback = true
        node.dont-move = true
        audio.position = [ FL FR ]
        stream.dont-remix = true
      }
    }
  }
]

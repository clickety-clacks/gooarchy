name: fast-check

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: Check Python syntax
        run: |
          python3 - <<'PY'
          import ast
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z", "*.py"]).split(b"\0")
          for raw_path in filter(None, paths):
              path = raw_path.decode()
              ast.parse(open(path, encoding="utf-8").read(), filename=path)
          PY
      - name: Check repository privacy
        run: python3 tools/privacy-check.py --tree
      - name: Run host-safe tests
        run: |
          python3 tests/vm/selftest.py
          bash tests/vm/process-guard-test.sh
          bash tests/vm/qemu-graphics-test.sh
          tests/flavorings-pkgbuild-source-test.sh
          bash tests/scottland-portal-provider-test.sh
          bash tests/repository-strata-bootstrap-test.sh
          bash tests/install-git-preflight-test.sh
      - name: Check update failure recovery
        run: cargo test --manifest-path system-tools/Cargo.toml -p gooarchy-update --locked
      - name: Test Gooarchy version entry points
        run: cargo test --manifest-path system-tools/Cargo.toml -p gooarchy-common -p gooarchy -p gooarchy-software --locked
      - name: Check every packaged system tool version flag
        run: python3 tests/system-tools-version-flags.py

# Where Gooarchy's packages come from, pinned to versions tested together. Override a pin in the
# environment to build that source locally (e.g. GOOARCHY_SCOTTLAND_REF=main).
# Read by install/packaging/*.sh and by packaging/arch/PKGBUILD.

# The default stays deliberately unusable until hosting choice A is made. Set this at install time.
GOOARCHY_REPOSITORY_URL=${GOOARCHY_REPOSITORY_URL:-https://packages.example.invalid/gooarchy}
# Package metadata uses this stable identity so install.sh can recognize signed repository copies.
GOOARCHY_REPOSITORY_PACKAGER='Gooarchy'

# Scottland, the desktop: built into the scottland package from its own PKGBUILD.
GOOARCHY_SCOTTLAND_REPO=${GOOARCHY_SCOTTLAND_REPO:-https://github.com/clickety-clacks/scottland.git}
GOOARCHY_SCOTTLAND_REF=${GOOARCHY_SCOTTLAND_REF:-f325ab1331944334010923fb5712558efd3f2395}

# Strata, the file manager: the strata-bin package from the AUR (Strata's own packaging); it is not
# part of the Gooarchy repository's served package set.
GOOARCHY_STRATA_AUR=${GOOARCHY_STRATA_AUR:-https://aur.archlinux.org/strata-bin.git}
# strata-bin 0.20.1
GOOARCHY_STRATA_REF=${GOOARCHY_STRATA_REF:-f3cbf298285fac2ee955dcce5753e80c3e1d132b}

# Where the parts Gooarchy builds come from, pinned to versions tested together. Override any of
# these in the environment to build something else (e.g. GOOARCHY_SCOTTLAND_REF=main).
# Read by install/packaging/*.sh and by packaging/arch/PKGBUILD.

# Scottland, the desktop: built into the scottland package from its own PKGBUILD.
GOOARCHY_SCOTTLAND_REPO=${GOOARCHY_SCOTTLAND_REPO:-https://github.com/clickety-clacks/scottland.git}
GOOARCHY_SCOTTLAND_REF=${GOOARCHY_SCOTTLAND_REF:-a875dde95543a7436d7e466114594e839eea6d79}

# Strata, the file manager: the strata-bin package from the AUR (Strata's own packaging) until
# Gooarchy has a package repository.
GOOARCHY_STRATA_AUR=${GOOARCHY_STRATA_AUR:-https://aur.archlinux.org/strata-bin.git}
# strata-bin 0.20.1
GOOARCHY_STRATA_REF=${GOOARCHY_STRATA_REF:-f3cbf298285fac2ee955dcce5753e80c3e1d132b}

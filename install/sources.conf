# Gooarchy main selects Scottland by its approved release tag. Explicit local overrides may select
# a final version tag or release branch; raw commit overrides are not supported.
# Read by install/packaging/*.sh. The Flavorings source URL and final version tag live in
# packaging/gooarchy-flavorings/PKGBUILD.

# Full database URL by default; existing directory-style mirror overrides remain supported.
GOOARCHY_REPOSITORY_URL=${GOOARCHY_REPOSITORY_URL:-https://gooarchy.com/gooarchy.db}
# Package metadata uses this stable identity so install.sh can recognize signed repository copies.
GOOARCHY_REPOSITORY_PACKAGER='Gooarchy'

# Scottland, the desktop: v0.4.4-rc1 supplies the preflighted 0.4.4-1 Core, Omarchy adapter, and
# Sunlight package trio. Its source commit is df37115b9108bd4853df1b693952026e5079a120 (tree
# 24d36bfbaf6b1a5d2fa81e8e4bc9d2e1f9bc527c). Package SHA-256 values are:
#   scottland: 08322e97c4b55a5cdbb56729c57c9cf6f702da2d8f254f2bea209f74f2e15e9c
#   scottland-omarchy: 734bde729571146db57ff5e67e9d3157d6956051aac771783425283b8a10a646
#   scottland-sunlight: fb5f4f10fe906470765210d438fcac1958a4029114cd01e6a859342171a588fb
GOOARCHY_SCOTTLAND_REPO=${GOOARCHY_SCOTTLAND_REPO:-https://github.com/clickety-clacks/scottland.git}
GOOARCHY_SCOTTLAND_PIN_REF=v0.4.4-rc1
GOOARCHY_SCOTTLAND_PIN_KIND=tag

# Source selection happens before install/packaging/base.sh installs Git. Validate branch names
# using shell rules here so a fresh install does not need Git just to read its package plan.
_gooarchy_valid_branch_ref() {
  local ref=$1
  [[ -n $ref && $ref != /* && $ref != */ && $ref != *//* && $ref != *..* &&
    $ref != *@\{* && $ref != *. ]] || return 1
  [[ ! $ref =~ [[:cntrl:][:space:]~^:?*\\] ]] || return 1
  [[ $ref != *'['* ]] || return 1
  [[ ! $ref =~ (^|/)\. ]] || return 1
  [[ ! $ref =~ (^|/)[^/]*\.lock(/|$) ]]
}

if [[ ${GOOARCHY_SCOTTLAND_REF+x} ]]; then
  [[ -n $GOOARCHY_SCOTTLAND_REF ]] || {
    echo "GOOARCHY_SCOTTLAND_REF must name a tag or branch." >&2
    return 1
  }
  [[ ! $GOOARCHY_SCOTTLAND_REF =~ ^[[:xdigit:]]{40}$ ]] || {
    echo "GOOARCHY_SCOTTLAND_REF must be a tag or branch name; raw commit overrides are not supported." >&2
    return 1
  }
  GOOARCHY_SCOTTLAND_REF_KIND=${GOOARCHY_SCOTTLAND_REF_KIND:-tag}
  case $GOOARCHY_SCOTTLAND_REF_KIND in
    tag)
      [[ $GOOARCHY_SCOTTLAND_REF =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "GOOARCHY_SCOTTLAND_REF must be a final version tag (vMAJOR.MINOR.PATCH)." >&2
          return 1
        }
      ;;
    branch)
      _gooarchy_valid_branch_ref "$GOOARCHY_SCOTTLAND_REF" || {
        echo "GOOARCHY_SCOTTLAND_REF is not a valid Git branch." >&2
        return 1
      }
      ;;
    *)
      echo "GOOARCHY_SCOTTLAND_REF_KIND must be tag or branch; raw commit overrides are not supported." >&2
      return 1
      ;;
  esac
  GOOARCHY_SCOTTLAND_SOURCE_KIND=$GOOARCHY_SCOTTLAND_REF_KIND
else
  [[ -z ${GOOARCHY_SCOTTLAND_REF_KIND:-} ]] || {
    echo "GOOARCHY_SCOTTLAND_REF_KIND requires an explicit tag or branch ref." >&2
    return 1
  }
  GOOARCHY_SCOTTLAND_REF=$GOOARCHY_SCOTTLAND_PIN_REF
  GOOARCHY_SCOTTLAND_SOURCE_KIND=$GOOARCHY_SCOTTLAND_PIN_KIND
  case $GOOARCHY_SCOTTLAND_SOURCE_KIND in
    tag)
      [[ $GOOARCHY_SCOTTLAND_REF =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ||
        $GOOARCHY_SCOTTLAND_REF == v0.4.1-rc1 ||
        $GOOARCHY_SCOTTLAND_REF == v0.4.3-rc1 ||
        $GOOARCHY_SCOTTLAND_REF == v0.4.4-rc1 ]] || {
          echo "the fixed Scottland tag pin must be a final version tag or an approved v0.4.1-rc1, v0.4.3-rc1, or v0.4.4-rc1 preview." >&2
          return 1
        }
      ;;
    branch)
      _gooarchy_valid_branch_ref "$GOOARCHY_SCOTTLAND_REF" || {
        echo "the fixed Scottland branch pin is not a valid Git branch." >&2
        return 1
      }
      ;;
    *)
      echo "the fixed Scottland pin kind must be tag or branch." >&2
      return 1
      ;;
  esac
fi

# Strata, the file manager: the strata-bin package from the AUR (Strata's own packaging); it is not
# part of the Gooarchy repository's served package set.
GOOARCHY_STRATA_AUR=${GOOARCHY_STRATA_AUR:-https://aur.archlinux.org/strata-bin.git}
# strata-bin 0.20.1
GOOARCHY_STRATA_REF=${GOOARCHY_STRATA_REF:-f3cbf298285fac2ee955dcce5753e80c3e1d132b}
